<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;width:100%;background:#07040d;color:#ecdcff}body{overflow-x:hidden;font-family:Georgia,serif;background:radial-gradient(ellipse at 50% 75%,#150a24,#07040d 85%)}button{font:inherit;cursor:pointer}button,[role=button]{-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid #ecdcff;outline-offset:5px}[hidden]{display:none!important}#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}.scene{position:relative;height:100svh;height:100dvh;min-height:620px;display:flex;flex-direction:column;align-items:center;overflow:hidden}header{z-index:1;text-align:center;width:min(86%,580px);padding-top:max(54px,env(safe-area-inset-top));animation:reveal 1.5s .3s both}.eyebrow{font:9px/1.5 system-ui,sans-serif;letter-spacing:4px;text-transform:uppercase;color:#a994c1;margin:0 0 17px}h1{font:italic 700 clamp(24px,5.9vw,39px)/1.3 'Playfair Display',Georgia,serif;text-wrap:balance;color:#c8a2ff;text-shadow:0 0 26px #b48cf24a;margin:0}.dedication{font:clamp(28px,6.5vw,39px)/1.2 'Great Vibes',cursive;margin:18px 0 0;color:#ecdcff}.bouquet-wrap{position:relative;flex:1;min-height:0;width:min(100%,570px)}#bouquet{width:100%;height:100%;overflow:visible}.subphrase{z-index:1;text-align:center;width:min(87%,550px);font:clamp(28px,6.7vw,39px)/1.2 'Great Vibes',cursive;margin:0 0 17px;color:#d9baff;animation:reveal 1.4s 2.7s both}.hint{font:10px/1.5 system-ui,sans-serif;letter-spacing:2px;color:#ad94c8;margin:0 0 max(35px,env(safe-area-inset-bottom));animation:pulse 3s 4s infinite, reveal 1s 3.2s both}.hint.dismissed{visibility:hidden}.plant{transform-origin:250px 555px;animation:sway var(--period) ease-in-out var(--phase) infinite alternate}.stem{fill:none;stroke:url(#stem);stroke-width:4;stroke-linecap:round;stroke-dasharray:1;animation:draw 1.8s var(--delay) both}.leaf{transform-origin:0 0;animation:grow 1.5s calc(var(--delay) + .3s) both}.tulip{cursor:pointer;outline:none}.focus-ring{opacity:0;fill:none;stroke:#ecdcff;stroke-width:1.5;stroke-dasharray:3 4}.tulip:focus-visible .focus-ring{opacity:1}.nod{transform-origin:0 29px;animation:nod 4s ease-in-out var(--phase) infinite alternate}.bloom{transform-origin:0 30px;animation:bloom 1.5s calc(var(--delay) + .9s) both}.petal{transform-origin:0 30px;animation:open 1.2s calc(var(--delay) + 1s + var(--p)*.09s) both}.shine{opacity:.12;transition:opacity .2s}.tulip:hover .shine,.tulip:focus-visible .shine{opacity:.4}.pop{transform-origin:0 15px}.pop.popping{animation:pop .55s ease-out}.popping .shine{opacity:.65}.paper{animation:paper 1.3s 1.8s both}.calendar-enter{animation:drop 1.3s 2.5s both}.calendar-swing{transform-origin:385px 385px;animation:sway 5s ease-in-out -1s infinite alternate}.calendar{cursor:pointer;outline:none}.calendar:focus-visible .calendar-outline{stroke:#c8a2ff;stroke-width:3}.calendar-page{transform-origin:385px 385px;transition:transform .9s ease-in,opacity .7s}.calendar.torn .calendar-page{transform:translate(40px,180px) rotate(35deg);opacity:0;pointer-events:none}.note{opacity:0;transform-origin:385px 440px;transform:scale(.7);transition:opacity .5s .2s,transform .5s .2s}.torn .note{opacity:1;transform:scale(1)}.music{position:fixed;right:15px;bottom:max(16px,env(safe-area-inset-bottom));z-index:3;width:39px;height:39px;border-radius:50%;border:1px solid #c8a2ff50;background:#1a1027cc;color:#d9baff;font-size:23px}.music[aria-pressed=true]{box-shadow:0 0 20px #b48cf240}.overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:24px;background:#07040dc9;backdrop-filter:blur(12px);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}.overlay.visible{visibility:visible;opacity:1}.card{position:relative;width:min(100%,410px);max-height:88dvh;overflow:auto;padding:28px 25px 35px;border:1px solid #c8a2ff65;border-radius:24px;background:linear-gradient(145deg,#2c1b3bea,#110a1df5);text-align:center;box-shadow:0 25px 100px #0008,0 0 70px #b48cf218;transform:scale(.93) translateY(15px);transition:transform .3s}.visible .card{transform:scale(1) translateY(0)}.close{position:absolute;right:10px;top:9px;width:38px;height:38px;background:none;border:0;color:#ecdcff;font:30px system-ui}.number{font:100px/1 'Creepster',fantasy;color:#d4202c;margin:10px 0 0;text-shadow:0 4px 20px #d4202c20}.card h2{font:36px/1.2 'Great Vibes',cursive;font-weight:400;margin:13px 0 20px}.message{font-size:15px;line-height:1.8;color:#decee9}.card-phrase{font:italic 700 19px/1.6 'Playfair Display',Georgia,serif;color:#c8a2ff;border-top:1px solid #c8a2ff25;padding-top:20px;margin-bottom:0}@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes grow{from{transform:scale(.05);opacity:0}to{transform:scale(1);opacity:1}}@keyframes bloom{from{transform:translateY(28px) scale(.4,.75);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}@keyframes open{from{transform:scaleX(.35)}to{transform:scaleX(1)}}@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}@keyframes nod{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}@keyframes paper{from{opacity:0;transform:translateY(75px)}to{opacity:1;transform:translateY(0)}}@keyframes drop{0%{opacity:0;transform:translateY(-100px) rotate(-12deg)}65%{opacity:1;transform:translateY(9px) rotate(3deg)}100%{opacity:1;transform:translateY(0) rotate(0)}}@keyframes pulse{50%{opacity:.4}}@keyframes pop{45%{transform:scale(1.08)}100%{transform:scale(1)}}@media(min-width:700px){header{padding-top:35px}.eyebrow{margin-bottom:10px}.dedication{margin-top:10px}.hint{margin-bottom:22px}}@media(max-height:700px){header{padding-top:25px}h1{font-size:25px}.eyebrow{margin-bottom:8px}.dedication{font-size:28px;margin-top:10px}.subphrase{font-size:28px;margin-bottom:10px}.hint{margin-bottom:23px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.stem{stroke-dashoffset:0}}
</style>

<script>
const CONFIG = {
  para: 'mi persona favorita',          // a quién va dedicado
  frase: 'Tú le das suerte a mi viernes 13',
  frase2: 'y siempre serás mi persona favorita <3',
  mensaje: 'Contigo hasta la mala suerte se vuelve bonita 💜',
  musica: 'musica.mp3'                  // opcional; si no existe, el botón se oculta
};
const $ = id => document.getElementById(id);
$('phrase').textContent=CONFIG.frase.replace(/ (\d+)/g,' $1');
$('dedication').textContent=`Para ${CONFIG.para}`;
$('subphrase').textContent=CONFIG.frase2;
$('message').textContent=CONFIG.mensaje;
$('modal-phrase').textContent=`${CONFIG.frase} ${CONFIG.frase2}`;
const motion=matchMedia('(prefers-reduced-motion: reduce)');
const NS='http://www.w3.org/2000/svg';
function svg(tag,attrs,parent){const el=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);parent.appendChild(el);return el;}
// Seis pétalos por copa: tres detrás y tres delante.
const shapes=[
'M0 32 C-28 19 -35 -22 -20 -53 C-5 -47 8 -19 0 32Z',
'M0 33 C-18 7 -15 -40 0 -61 C20 -40 24 8 0 33Z',
'M0 32 C-7 -17 8 -46 25 -53 C39 -19 29 21 0 32Z',
'M0 35 C-32 32 -43 -7 -36 -43 C-17 -41 7 -8 0 35Z',
'M0 35 C27 34 44 -6 36 -44 C16 -41 -7 -6 0 35Z',
'M0 36 C-21 29 -25 -9 -15 -31 Q0 -23 15 -33 C29 -7 23 28 0 36Z'
];
const tulips=[[178,144,.86,-17],[300,126,.9,12],[247,95,1,-3],[111,230,.84,-25],[378,221,.85,25],[201,230,1,-10],[303,235,1,13],[155,320,.86,-20],[267,326,.97,5]];
tulips.forEach(([x,y,s,a],i)=>{
 const plant=svg('g',{class:'plant',style:`--period:${3+i*.45}s;--phase:${-i*.7}s;--delay:${i*.12}s`},$('flowers'));
 svg('path',{class:'stem',d:`M250 555 C${250+(x-250)*.25} 440 ${x+15} ${y+140} ${x} ${y+30}`,pathLength:1},plant);
 for(let j=0;j<2;j++){
  const t=.53+j*.2,lx=x+(250-x)*t,ly=y+35+(520-y)*t,dir=(i+j)%2?1:-1;
  const pos=svg('g',{transform:`translate(${lx} ${ly}) rotate(${dir*19}) scale(${dir*(.65+i%3*.13)} .9)`},plant);
  const leaf=svg('g',{class:'leaf'},pos);
  svg('path',{d:'M0 0 C-24 -43 -19 -112 -46 -165 C8 -134 30 -48 0 0Z',fill:'url(#leaf)'},leaf);
  svg('path',{d:'M0 0 Q7 -83 -46 -165 Q-7 -92 0 0',fill:'#a4d5aa',opacity:.13},leaf);
 }
 const pos=svg('g',{transform:`translate(${x} ${y}) rotate(${a}) scale(${s})`},plant);
 const button=svg('g',{class:'tulip',tabindex:0,role:'button','aria-label':`Tulipán lila ${i+1}: una sorpresa para ti`,'aria-haspopup':'dialog'},pos);
 svg('ellipse',{cx:0,cy:-10,rx:47,ry:58,fill:'transparent'},button);
 svg('ellipse',{class:'focus-ring',cx:0,cy:-10,rx:47,ry:58},button);
 const nod=svg('g',{class:'nod'},button),bloom=svg('g',{class:'bloom'},nod),pop=svg('g',{class:'pop'},bloom);
 shapes.forEach((d,p)=>svg('path',{d,class:'petal',style:`--p:${p}`,fill:`url(#${p<3?'back':'lilac'})`,stroke:'#ecdcff','stroke-opacity':p<3?.25:.55,'stroke-width':.7},pop));
 svg('path',{class:'shine',d:'M-29 -31 Q-30 8 -13 22 M-8 -22 Q-14 5 -3 23 M29 -30 Q30 -4 19 11',fill:'none',stroke:'#fff4ff','stroke-width':2,'stroke-linecap':'round'},pop);
 activate(button,()=>{
  if(!motion.matches){pop.classList.remove('popping');void pop.getBoundingClientRect();pop.classList.add('popping');const r=button.getBoundingClientRect();burst(r.x+r.width/2,r.y+r.height/2);}
  if(!opened)openModal(button);
 });
});
function activate(el,fn){el.addEventListener('click',fn);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn();}});}
const modal=$('modal'),close=$('close');let opened=false,previousFocus=null;
function openModal(source){opened=true;previousFocus=source;modal.inert=false;modal.classList.add('visible');$('scene').inert=true;$('music').inert=true;$('hint').classList.add('dismissed');close.focus();}
function closeModal(){modal.classList.remove('visible');modal.inert=true;$('scene').inert=false;$('music').inert=false;previousFocus?.focus();}
close.addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});
document.addEventListener('keydown',e=>{if(!modal.classList.contains('visible'))return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){e.preventDefault();close.focus();}});
activate($('calendar'),()=>{const torn=$('calendar').classList.toggle('torn');$('calendar').setAttribute('aria-pressed',String(torn));$('calendar').setAttribute('aria-label',torn?'Tú eres mi suerte 💜. Restaurar el calendario':'Abrir la nota del calendario');});
// El control aparece solo cuando hay una canción disponible.
const audio=$('audio'),music=$('music');let attempted=false,failed=false;
audio.volume=.6;if(CONFIG.musica)audio.src=CONFIG.musica;
function startMusic(){if(attempted||failed||!CONFIG.musica)return;attempted=true;audio.play().catch(()=>{});}
document.addEventListener('pointerdown',e=>{if(!music.contains(e.target))startMusic();},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')startMusic();});
audio.addEventListener('loadedmetadata',()=>{if(!failed)music.hidden=false;});
audio.addEventListener('error',()=>{failed=true;music.hidden=true;});
function musicState(){music.setAttribute('aria-pressed',String(!audio.paused));music.setAttribute('aria-label',audio.paused?'Reproducir música':'Pausar música');}
audio.addEventListener('play',musicState);audio.addEventListener('pause',musicState);
music.addEventListener('click',()=>{attempted=true;if(audio.paused)audio.play().catch(()=>{});else audio.pause();});
// Un lienzo para la luna, la niebla y las partículas; el tiempo se pausa al ocultar la pestaña.
const canvas=$('sky'),ctx=canvas.getContext('2d');const random=(a,b)=>a+Math.random()*(b-a);
let w=0,h=0,stars=[],flies=[],petals=[],raf=0,last=0,time=0,nextFlash=random(15,25),flash=-10,nextPetal=6;
const bats=Array.from({length:4},(_,i)=>({offset:i*5.7,period:29+i*2,size:random(5,9),height:random(.11,.32)}));
function firefly(){return{x:random(0,w),y:random(0,h),r:random(.7,1.8),phase:random(0,7),speed:random(8,19)};}
function burst(x,y){for(let i=0;i<7;i++)petals.push({x,y,vx:random(-65,65),vy:random(-100,-20),age:0,life:random(2.4,3.7),r:random(3,6),phase:random(0,6)});petals=petals.slice(-70);}
function resize(){w=innerWidth;h=innerHeight;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.min(140,Math.floor(w*h/4000))},()=>({x:random(0,w),y:random(0,h),r:random(.4,1.2),phase:random(0,7)}));flies=Array.from({length:30},firefly);render(0);}
function render(dt){
 ctx.clearRect(0,0,w,h);const still=motion.matches,t=still?0:time;
 for(const s of stars){ctx.globalAlpha=still?.55:.25+.45*(.5+.5*Math.sin(t*.7+s.phase));ctx.fillStyle='#ecdcff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;
 const small=w<700,mx=w*.9,my=small?42:Math.min(115,h*.12),mr=small?22:Math.min(39,w*.075);
 const glow=ctx.createRadialGradient(mx,my,mr*.7,mx,my,mr*3);glow.addColorStop(0,'#f4ecd827');glow.addColorStop(1,'#f4ecd800');ctx.fillStyle=glow;ctx.fillRect(mx-mr*3,my-mr*3,mr*6,mr*6);
 ctx.fillStyle='#f4ecd8';ctx.beginPath();ctx.arc(mx,my,mr,0,Math.PI*2);ctx.fill();
 for(const [x,y,r] of [[-.3,-.2,.2],[.25,.3,.27],[.4,-.35,.13],[-.4,.4,.1]]){ctx.fillStyle='#b0a49625';ctx.beginPath();ctx.arc(mx+x*mr,my+y*mr,r*mr,0,Math.PI*2);ctx.fill();}
 ctx.globalAlpha=still?1:Math.min(1,t/3);
 for(let i=0;i<5;i++){const x=((i*w*.31+t*(5+i*2))%(w*1.7))-w*.35,y=h*(.76+i*.045);ctx.save();ctx.translate(x,y);ctx.scale(3.8,1);const fog=ctx.createRadialGradient(0,0,0,0,0,95);fog.addColorStop(0,'#b9a5cf0c');fog.addColorStop(1,'#b9a5cf00');ctx.fillStyle=fog;ctx.fillRect(-95,-95,190,190);ctx.restore();}ctx.globalAlpha=1;
 for(const b of bats){const cycle=(t+b.offset)%b.period;if(cycle>10)continue;const x=-30+(w+60)*cycle/10,y=h*b.height+Math.sin(t*.8+b.offset)*15;ctx.save();ctx.translate(x,y);ctx.scale(b.size,b.size*(still?.65:.7+.3*Math.sin(t*10+b.offset)));ctx.fillStyle='#08050e';ctx.beginPath();ctx.moveTo(0,.4);ctx.quadraticCurveTo(-.8,-1.4,-2.2,-.8);ctx.quadraticCurveTo(-1.6,-.2,-1.5,.6);ctx.quadraticCurveTo(-.8,.1,0,.8);ctx.quadraticCurveTo(.8,.1,1.5,.6);ctx.quadraticCurveTo(1.6,-.2,2.2,-.8);ctx.quadraticCurveTo(.8,-1.4,0,.4);ctx.fill();ctx.beginPath();ctx.ellipse(0,.3,.28,.65,0,0,Math.PI*2);ctx.fill();ctx.restore();}
 for(const p of flies){if(!still){p.y-=p.speed*dt;p.x+=Math.sin(t+p.phase)*5*dt;if(p.y< -10){p.y=h+10;p.x=random(0,w);}}ctx.globalAlpha=.2+.4*(.5+.5*Math.sin(t+p.phase));ctx.fillStyle='#d7b5ff';ctx.shadowColor='#b48cf2';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}ctx.shadowBlur=0;ctx.globalAlpha=1;
 if(still)return;
 if(t>nextPetal){petals.push({x:random(w*.3,w*.7),y:h*.43,vx:random(-8,8),vy:15,age:0,life:6,r:4,phase:random(0,7)});nextPetal=t+random(5,9);}
 for(let i=petals.length-1;i>=0;i--){const p=petals[i];p.age+=dt;if(p.age>p.life){petals.splice(i,1);continue;}p.vy+=22*dt;p.x+=(p.vx+Math.sin(t*2+p.phase)*12)*dt;p.y+=p.vy*dt;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.phase+t+Math.sin(t*2)*.4);ctx.globalAlpha=Math.min(1,(p.life-p.age)*.8);ctx.fillStyle='#c8a2ff';ctx.beginPath();ctx.moveTo(-p.r,0);ctx.bezierCurveTo(-p.r,-p.r,p.r,-p.r*1.5,p.r,p.r*.4);ctx.quadraticCurveTo(0,p.r*1.5,-p.r,0);ctx.fill();ctx.restore();}
 if(t>=nextFlash){flash=t;nextFlash=t+random(15,25);}const age=t-flash;if(age<.12||(age>.22&&age<.29)){ctx.fillStyle=age<.12?'#ffffff14':'#ffffff09';ctx.fillRect(0,0,w,h);}
}
function frame(now){const dt=Math.min((now-last)/1000,.04);last=now;time+=dt;render(dt);raf=requestAnimationFrame(frame);}
function restart(){cancelAnimationFrame(raf);last=performance.now();if(!document.hidden&&!motion.matches)raf=requestAnimationFrame(frame);else if(!document.hidden)render(0);}
window.addEventListener('resize',resize);document.addEventListener('visibilitychange',restart);motion.addEventListener('change',()=>{petals=[];flash=-10;restart();});resize();restart();
</script>
